# 码表（Issue #14）
# 从客户「基础报关参数数据.xlsx」全量转录，原件不进仓库。
# 名称 → code，精确匹配（只 strip）。未知返回空，不瞎填。
# 俗称（莲塘口岸、纸箱）不收，交 #27。
#
# 港口码写死：指运港 / 启运港走「港口代码」一张表，按中文名精确匹配。
# HKG000 风格与六位特殊监管区共存于同一张表，不选边、不混进「海关口岸代码」。
# 申报地 / 出境关走四位「海关口岸代码」。
#
# code 一律字符串：4 不补成 04；0110 保留前导零。

