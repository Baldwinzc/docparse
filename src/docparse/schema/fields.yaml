# 占位字段。需求方给出真实清单后只改本文件。
version: 1
document_types:
  - customs_declaration
  - invoice
  - packing_list
  - bill_of_lading
  - contract
  - unknown

fields:
  - name: customs_declaration_no
    display_name: 报关单号
    required: true
    value_type: string
    sources: [customs_declaration]
    pattern: '^[A-Za-z0-9]{10,32}$'
    anchors: [海关编号, 报关单号, 报关单编号]
    extractors: [rule, llm]

  - name: invoice_no
    display_name: 发票号
    required: false
    value_type: string
    sources: [invoice, customs_declaration]
    anchors: [发票号, Invoice No, Invoice Number]
    extractors: [rule, llm]

  - name: contract_no
    display_name: 合同号
    required: false
    value_type: string
    sources: [contract, customs_declaration]
    anchors: [合同号, 合同协议号, Contract No]
    extractors: [rule, llm]

  - name: declaration_date
    display_name: 申报日期
    required: false
    value_type: date
    sources: [customs_declaration]
    anchors: [申报日期, 出口日期, 进口日期]
    extractors: [rule, llm]

  - name: total_amount
    display_name: 总价
    required: false
    value_type: money
    sources: [customs_declaration, invoice]
    anchors: [总价, 价税合计, Amount]
    extractors: [rule, llm]
