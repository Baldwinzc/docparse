    value_type: number
    sources: [customs_declaration]
    anchors: [杂费]
    head_map: skip
    notes: 与杂费标志同一格。拆分见 #34。

  - name: otherCurr
    display_name: 杂费货币类型
    group: head
    layout: box_kv
    sources: [customs_declaration]
    anchors: [杂费]
    code_table: 币制
    head_map: skip
    notes: 与杂费标志同一格。拆分见 #34。

  - name: markNo
    display_name: 标记唛码
    group: head
    layout: box_kv
    sources: [customs_declaration, packing_list]
    anchors: [标记唛码及备注, 标记唛码]
    notes: json 默认 N/M。与备注同一格时整格先挂本字段；拆分见 #36。抽不到不编造 N/M。

  - name: noteS
    display_name: 备注
    group: head
    layout: box_kv
    sources: [customs_declaration]
    anchors: [备注]
    notes: 独立「备注」键可收。与唛码同一格的拆分见 #36。

  - name: attachedDocs
    display_name: 随附单证及编号
    group: head
    layout: box_kv
    sources: [customs_declaration]
    anchors: [随附单证及编号, 随附单证]
    notes: 草单有格。结构化数组见 tdecDocusVoArr；本字段先收原文。拆条交后续组装。

  - name: goodsPlace
    display_name: 货物存放地点
    group: head
    layout: box_kv
    sources: [customs_declaration]
    anchors: [货物存放地点]
    notes: json 漏标。半岛参考 JSON 有；出口草单常无。

  - name: promiseItems
    display_name: 其他事项确认(TCS承诺事项)
    group: head
    layout: none
    sources: [customs_declaration]
    anchors: [承诺事项, 其他事项确认]
    notes: json 有。草单通常无。promiseItem1/2/3 已忽略，本字段可空。

goods:
  - name: gno
    display_name: 商品序号
    group: goods
    layout: table_col
    value_type: number
    sources: [customs_declaration]
    anchors: [项号, Item]
    notes: 商品表列。有海关商品表以它为主。不要编造项号。

  - name: codeTs
    display_name: 商品编号(T+S)
    group: goods
    layout: table_col
    sources: [customs_declaration]
    anchors: [商品编号, 项目编号, 商品编码, 海关编码, HS]
    goods_map: leading_hs
    notes: HS 编码。列值前缀 8–10 位数字时只取编号。

  - name: gname
    display_name: 商品名称
    group: goods
    layout: table_col
    sources: [customs_declaration, packing_list, invoice]
    anchors: [商品名称及规格型号, 商品名称及商品规格, 商品名称, 货物名称, 物料名称, Description]
    notes: 海关商品表优先。箱单 / 发票只补空。

  - name: gmodel
    display_name: 规格型号
    group: goods
    layout: table_col
    sources: [customs_declaration]
    anchors: [申报要素, 规格型号, 商品规格]
    goods_map: raw_review
    notes: 原文进本字段。0|0|... 规范编码本层不编，标 needs_review。

  - name: brand
    display_name: 品牌
    group: goods
    layout: table_col
    sources: [customs_declaration]
    anchors: [品牌]
    notes: 草单商品表有「品牌」列。与 gmodel 同时有则两字段都留，不互吞。

  - name: declPrice
    display_name: 申报单价
    group: goods
    layout: table_col
    value_type: number
    sources: [customs_declaration, invoice]
    anchors: [单价, Unit Price]
    notes: 海关商品表优先，发票补充。

  - name: declTotal
    display_name: 申报总价
    group: goods
    layout: table_col
    value_type: number
    sources: [customs_declaration, invoice]
    anchors: [总价, 汇总价, 总值, Amount]
    notes: 海关商品表优先。可能是公式。

  - name: tradeCurr
    display_name: 币制
    group: goods
    layout: table_col
    sources: [customs_declaration, invoice]
    anchors: [币制, 币别, 币值]
    code_table: 币制
    notes: 表上常是 HKD/USD 字母，转码交 #14。

  - name: gqty
    display_name: 成交数量
    group: goods
    layout: table_col
    value_type: number
    sources: [customs_declaration, packing_list, invoice]
    anchors: [出货数量, 成交数量, 数量, Quantity, Q'ty, Qty]
    notes: 海关商品表优先。别名交 #13。

  - name: gunit
    display_name: 成交单位
    group: goods
    layout: table_col
    sources: [customs_declaration]
    anchors: [计价单位, 成交单位, 申报单位, 单位]
    code_table: 计量单位
    notes: 名称转码交 #14。映射层可认「单位」列；layout 词表仍不加，防框表误伤。

  - name: qty1
    display_name: 法定第一数量
    group: goods
    layout: table_col
    value_type: number
    sources: [customs_declaration]
    anchors: [法定第一数量, 法定数量]
    notes: 只认法定数量列。重量 / 重量KG / 净重不进本字段，见 customNetWt。

  - name: unit1
    display_name: 法定第一计量单位
    group: goods
    layout: table_col
    sources: [customs_declaration]
    anchors: [法定第一计量单位, 法定单位]
    code_table: 计量单位
    notes: 草单常无独立列；有则抽。

  - name: qty2
    display_name: 法定第二数量
    group: goods
    layout: table_col
    value_type: number
    sources: [customs_declaration]
    anchors: [法定第二数量]
    notes: 仅部分商品有。无则空。

  - name: unit2
    display_name: 法定第二计量单位
    group: goods
    layout: table_col
    sources: [customs_declaration]
    anchors: [法定第二计量单位]
    code_table: 计量单位
    notes: 仅部分商品有。无则空。

  - name: cusOriginCountry
    display_name: 原产国(地区)
    group: goods
    layout: table_col
    sources: [customs_declaration]
    anchors: [原产国, 原產國, 原产地, Country of Origin]
    code_table: 国别
    notes: 名称转码交 #14。

  - name: destinationCountry
    display_name: 最终目的国代码
    group: goods
    layout: table_col
    sources: [customs_declaration]
    anchors: [最终目的国, 最终目的地]
    code_table: 国别
    notes: 名称转码交 #14。

  - name: districtCode
    display_name: 境内目的地/境内货源地
    group: goods
    layout: table_col
    sources: [customs_declaration]
    anchors: [境内货源地, 境内目的地]
    code_table: 国内地区
    notes: 出口为境内货源地。

  - name: dutyMode
    display_name: 征免方式
    group: goods
    layout: table_col
    sources: [customs_declaration]
    anchors: [征免, 征免方式]
    code_table: 征免方式
    notes: 与表头 cutMode（征免性质）不是同一个字段。

  - name: customGrossWet
    display_name: 自定义毛重
    group: goods
    layout: table_col
    value_type: number
    sources: [customs_declaration, packing_list]
    anchors: [总毛重, 毛重, "G.W.", "G.W", GW]
    notes: json 原字段名 Wet。箱单可补充。无毛重列时由净重抄一份，见 #18。

  - name: customNetWt
    display_name: 自定义净重
    group: goods
    layout: table_col
    value_type: number
    sources: [customs_declaration, packing_list]
    anchors: [总净重, 净重, 重量KG, 重量, "N.W.", NW]
    notes: 未区分的「重量 / 重量KG」当净重。不进 qty1。无毛重列再抄到 customGrossWet。

  - name: exgVersion
    display_name: 加工成品单耗版本号
    group: goods
    layout: table_col
    sources: [customs_declaration]
    anchors: [单耗版本号]
    notes: json 有。一般贸易常空。
