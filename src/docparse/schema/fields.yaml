# 出口报关单输出字段目录（Issue #12）
# 形状对齐 Demo 字段说明.json；草单上看得到、json 没有的从 报关字段说明.md 补。
# 客户原件不进仓库。本文件只是目录，不接样本、不改组装。

version: 2
goods_array: tdecGoodsitemsVoArr

# 主货表计分（#18）。看已映射列，不看公司名。draft 加权，auxiliary / unknown 不参与。
goods_master:
  min_score: 1
  match_keys: [gno, codeTs, gname, gqty]
  role_bonus:
    draft: 10
    packing: 1
    invoice: 1
    contract: 0
  signals:
    - field: gno
      weight: 5
    - field: codeTs
      weight: 5
    - field: gmodel
      weight: 4
    - field: gname
      weight: 3
    - field: gqty
      weight: 2
    - field: gunit
      weight: 2
    - field: declPrice
      weight: 2
    - field: declTotal
      weight: 2
    - field: tradeCurr
      weight: 2
    - field: cusOriginCountry
      weight: 2
    - field: destinationCountry
      weight: 2
    - field: districtCode
      weight: 2

# 整单组装（#19）。按角色，不按公司。有 draft 抄草单；无 draft 拼商业单据。
# 新角色加 role_priority / fill；新核对字段加 reconcile；海关专用项加 customs_only。
assembly:
  primary_role: draft
  role_priority: [draft, packing, invoice, contract]
  fill:
    draft: overwrite
    packing: fill
    invoice: fill
    contract: fill
  reconcile: [packNo, grossWt, netWt]
  customs_only:
    - customMaster
    - iePort
    - ciqEntyPortCode
    - supvModeCdde
    - cutMode
    - wrapType
    - licenseNo
    - manualNo
  defaults:
    cusIEFlag: E
  weight:
    net_as_weight: true
    copy_net_to_gross: false
  invoice_vocab: invoice_no

document_types:
  - customs_declaration
  - invoice
  - packing_list
  - bill_of_lading
  - contract
  - unknown

# 出境关别 / 申报地海关 / 离境口岸。字段已定；码型与样本错填见 notes。
port_mapping:
  - draft_label: 申报地海关
    field: customMaster
    code_table: 海关口岸代码
    status: decided
    notes: 四位关区代码（如 5341 深惠州关、5352 梅沙海关）。草单不一定有独立格。

  - draft_label: 出境关别
    field: iePort
    code_table: 海关口岸代码
    status: decided
    notes: 标准表「进/出口口岸」。恒信草单标签是「出境关别」。参考 JSON 把莲塘写进 customMaster，目录不跟着错。

  - draft_label: 离境口岸
    field: ciqEntyPortCode
    code_table: 入境/离境口岸
    status: decided
    notes: CIQ 口岸，不是四位海关关区。半岛参考值 477101。

  - draft_label: 指运港
    field: distinatePort
    code_table: 港口代码
    status: decided
    notes: 识别结果用 HKG000 / HKG003 风格。六位特殊监管区码型交 #14，不改本字段。

  - draft_label: 启运港
    field: despPortCode
    code_table: 港口代码
    status: decided
    notes: json 漏标；出口草单常空。有则抽。

