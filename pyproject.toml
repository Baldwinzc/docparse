[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docparse"
version = "0.1.0"
description = "多格式单据解析流水线：压缩包 / PDF / Excel，规则优先，LLM API 兜底"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Baldwinzc", email = "1018067278@qq.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "openpyxl>=3.1"]
pdf = ["pymupdf>=1.24"]
excel = ["openpyxl>=3.1"]

[project.scripts]
docparse = "docparse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docparse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/docparse/api/routes.py" = ["B008"]
